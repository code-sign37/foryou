<!DOCTYPE html>

<html lang="id">

<head>

  <meta charset="UTF-8" />

  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />

  <title>Untuk Kamu 💕</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet" />

  <style>

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }



    html, body {

      height: 100%;

      overflow: hidden;

      font-family: "Nunito", system-ui, -apple-system, sans-serif;

    }



    .bg {

      position: fixed;

      inset: 0;

      z-index: 0;

    }



    .bg img {

      width: 100%;

      height: 100%;

      object-fit: cover;

      transform: scale(1.08);

      filter: blur(14px);

    }



    .bg-overlay {

      position: fixed;

      inset: 0;

      z-index: 1;

      background: rgba(0, 0, 0, 0.55);

    }



    .hearts {

      position: fixed;

      inset: 0;

      z-index: 2;

      pointer-events: none;

      overflow: hidden;

      opacity: 0;

      transition: opacity 1.2s ease;

    }



    .hearts.active { opacity: 1; }



    .heart {

      position: absolute;

      bottom: -40px;

      font-size: 18px;

      animation: floatUp linear infinite;

      opacity: 0.85;

    }



    @keyframes floatUp {

      0% { transform: translateY(0) rotate(0deg); opacity: 0; }

      10% { opacity: 0.9; }

      100% { transform: translateY(-110vh) rotate(25deg); opacity: 0; }

    }



    .stage {

      position: relative;

      z-index: 3;

      min-height: 100%;

      display: flex;

      align-items: center;

      justify-content: center;

      padding: 24px 16px;

    }



    .card {

      width: 100%;

      max-width: 340px;

      border: 1px solid rgba(255, 255, 255, 0.85);

      border-radius: 22px;

      padding: 28px 22px 26px;

      background: rgba(30, 30, 32, 0.72);

      backdrop-filter: blur(12px);

      -webkit-backdrop-filter: blur(12px);

      text-align: center;

      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.35);

      animation: cardIn 0.7s ease-out;

      transition: transform 0.25s ease;

    }



    .card.sequence {

      max-width: 300px;

      padding: 14px 14px 20px;

      cursor: pointer;

      -webkit-tap-highlight-color: transparent;

    }



    .card.sequence:active { transform: scale(0.985); }



    .card.swap { animation: cardSwap 0.45s ease; }



    @keyframes cardIn {

      from { opacity: 0; transform: translateY(16px) scale(0.98); }

      to { opacity: 1; transform: translateY(0) scale(1); }

    }



    @keyframes cardSwap {

      0% { opacity: 1; transform: scale(1); }

      45% { opacity: 0.35; transform: scale(0.97); }

      100% { opacity: 1; transform: scale(1); }

    }



    .sticker-wrap {

      width: 118px;

      height: 118px;

      margin: 0 auto 18px;

      background: rgba(255, 255, 255, 0.92);

      border-radius: 14px;

      display: flex;

      align-items: center;

      justify-content: center;

      overflow: hidden;

    }



    .card.sequence .sticker-wrap {

      width: 100%;

      height: 200px;

      margin: 0 0 16px;

      background: rgba(180, 180, 185, 0.35);

      border-radius: 12px;

    }



    .sticker-wrap img {

      width: 100%;

      height: 100%;

      object-fit: contain;

      transform: translateZ(0);

      backface-visibility: hidden;

    }



    .title {

      color: #fff;

      font-size: 1.35rem;

      font-weight: 800;

      line-height: 1.35;

      margin-bottom: 10px;

      letter-spacing: -0.02em;

    }



    .card.sequence .title {

      font-size: 1.15rem;

      margin-bottom: 0;

      font-weight: 700;

    }



    .subtitle {

      color: rgba(255, 255, 255, 0.95);

      font-size: 0.92rem;

      font-weight: 400;

      line-height: 1.45;

      margin-bottom: 22px;

    }



    .card.sequence .subtitle { display: none; }



    .play-btn {

      width: 56px;

      height: 56px;

      margin: 0 auto;

      border: none;

      border-radius: 50%;

      background: linear-gradient(145deg, #ff6b9d, #ff4081);

      color: #fff;

      cursor: pointer;

      display: flex;

      align-items: center;

      justify-content: center;

      box-shadow: 0 6px 20px rgba(255, 64, 129, 0.45);

      transition: transform 0.2s ease, box-shadow 0.2s ease;

    }



    .play-btn:hover { transform: scale(1.06); }

    .play-btn:active { transform: scale(0.96); }



    .play-btn svg {

      width: 26px;

      height: 26px;

      margin-left: 4px;

    }



    .card.sequence .play-btn { display: none; }



    .hint {

      margin-top: 14px;

      font-size: 0.72rem;

      font-weight: 600;

      color: rgba(255, 255, 255, 0.45);

      letter-spacing: 0.04em;

      text-transform: uppercase;

    }



    .card.sequence .hint {

      margin-top: 12px;

      text-transform: none;

      letter-spacing: 0;

      font-size: 0.78rem;

      font-weight: 500;

      color: rgba(255, 255, 255, 0.4);

    }



    .step-bar {

      display: flex;

      gap: 5px;

      justify-content: center;

      margin-top: 14px;

      opacity: 0;

      transition: opacity 0.35s ease;

    }



    .step-bar.visible { opacity: 1; }



    .step-bar span {

      width: 5px;

      height: 5px;

      border-radius: 50%;

      background: rgba(255, 255, 255, 0.22);

      transition: background 0.25s, transform 0.25s;

    }



    .step-bar span.on {

      background: #ff8fab;

      transform: scale(1.3);

    }

  </style>

</head>

<body>

  <div class="bg">

    <img

      src="https://i.ibb.co/L1Pckpn/tumblr-dddc228bd0cdd33c9382646f6a5a9127-9d02ef7e-540.gif"

      alt=""

      referrerpolicy="no-referrer"

    />

  </div>

  <div class="bg-overlay"></div>

  <div class="hearts" id="hearts" aria-hidden="true"></div>



  <main class="stage">

    <article class="card intro" id="card">

      <div class="sticker-wrap" id="sticker" aria-hidden="true"></div>



      <h1 class="title" id="title">Kamu Lagi Betmut yaa? 🥺</h1>

      <p class="subtitle" id="subtitle">Coba Klik Tombol PLAY di Bawah ini</p>



      <button type="button" class="play-btn" id="playBtn" aria-label="Putar">

        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">

          <path d="M8 5v14l11-7z"/>

        </svg>

      </button>

      <p class="hint" id="hint">tap play · volume nyalain ya</p>

      <div class="step-bar" id="stepBar"></div>

    </article>

  </main>



  <audio id="audio" preload="auto" loop>

    <source src="music.mp3" type="audio/mpeg" />

    <source src="https://j.top4top.io/m_3924o50qr1.mp3" type="audio/mpeg" />

  </audio>



  <script>

    const NAMA = "sayang";



    /** Ganti file di folder gifs/ kalau mau stiker custom (link top4top, dll.) */
    const GIFS = {
      intro: "gifs/pisang.gif",
      peek: "gifs/intro.gif",
      nara: "gifs/hug.gif",
      kiss: "gifs/kiss.gif",
      hug: "gifs/akuada.gif",
      akuada: "gifs/cuddle-cute.gif",
      smile: "gifs/smile.gif",
      chat: "gifs/friday.gif",
    };

    const gifCache = new Map();

    function preloadGifs() {
      Object.entries(GIFS).forEach(([key, src]) => {
        if (gifCache.has(key)) return;
        const img = new Image();
        img.src = src;
        gifCache.set(key, img);
      });
    }

    preloadGifs();



    const steps = [

      { text: "Ciluuuukkkk, Baaa 🙈", sticker: "peek", next: true },

      { text: "Emuuaacchh >_>", sticker: "kiss", next: true },

      { text: "Jangan betmut terus yaa >_>", sticker: "smile", next: true },

      { text: "Senyum dikit dong, Kamu tuh cantik soalnya :/", sticker: "nara", next: true },

      { text: `Aku ada buat kamu, ${NAMA} >`, sticker: "hug", next: true },

      { text: "Sini ta Peluk Dulu:V >", sticker: "akuada", next: true },

      { text: "Kalau mau curhat, chat aku aja >", sticker: "chat", next: true },

    ];



    const card = document.getElementById("card");

    const stickerEl = document.getElementById("sticker");

    const titleEl = document.getElementById("title");

    const playBtn = document.getElementById("playBtn");

    const audio = document.getElementById("audio");

    const heartsEl = document.getElementById("hearts");

    const stepBar = document.getElementById("stepBar");

    const hintEl = document.getElementById("hint");



    let inSequence = false;

    let stepIndex = 0;



    steps.forEach(() => {

      const dot = document.createElement("span");

      stepBar.appendChild(dot);

    });



    function setSticker(key) {

      const src = GIFS[key] || GIFS.heart;

      stickerEl.innerHTML = "";

      const img = document.createElement("img");

      img.className = "sticker-gif";

      img.alt = "";

      img.decoding = "async";

      img.src = src;

      stickerEl.appendChild(img);

    }



    function updateStepBar(i) {

      stepBar.querySelectorAll("span").forEach((d, idx) => {

        d.classList.toggle("on", idx === i);

      });

    }



    function spawnHearts() {

      if (heartsEl.childElementCount) return;

      const chars = ["💗", "💕", "🤍", "✨", "🥺"];

      for (let i = 0; i < 18; i++) {

        const h = document.createElement("span");

        h.className = "heart";

        h.textContent = chars[i % chars.length];

        h.style.left = Math.random() * 100 + "%";

        h.style.animationDuration = 6 + Math.random() * 8 + "s";

        h.style.animationDelay = Math.random() * 5 + "s";

        heartsEl.appendChild(h);

      }

    }



    function showStep(index) {

      const step = steps[index];

      card.classList.remove("swap");

      void card.offsetWidth;

      card.classList.add("swap");



      setSticker(step.sticker);

      titleEl.textContent = step.text;

      updateStepBar(index);



      if (step.next) {

        hintEl.textContent = "ketuk kartu untuk lanjut";

      } else {

        hintEl.textContent = "ketuk lagi kalau mau ulang dari awal";

      }

    }



    function enterSequence() {

      inSequence = true;

      card.classList.remove("intro");

      card.classList.add("sequence");

      stepBar.classList.add("visible");

      stepIndex = 0;

      showStep(0);

    }



    function nextStep() {

      if (!inSequence) return;



      if (stepIndex < steps.length - 1) {

        stepIndex++;

        showStep(stepIndex);

        return;

      }



      stepIndex = 0;

      showStep(0);

    }



    setSticker("intro");



    playBtn.addEventListener("click", async (e) => {

      e.stopPropagation();

      try {

        audio.volume = 0.35;

        await audio.play();

      } catch (err) {

        console.warn(err);

      }

      preloadGifs();

      spawnHearts();

      heartsEl.classList.add("active");

      enterSequence();

    });



    card.addEventListener("click", () => {

      if (inSequence) nextStep();

    });



    card.addEventListener("keydown", (e) => {

      if (inSequence && (e.key === "Enter" || e.key === " ")) {

        e.preventDefault();

        nextStep();

      }

    });

  </script>

</body>

</html>
